name: Build Windows Executable

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_NODE_TYPE: node24

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # Grants permission to create releases and upload assets

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore src/PCNetworkBackup.Core/PCNetworkBackup.Core.csproj
          dotnet restore src/PCNetworkBackup.App/PCNetworkBackup.App.csproj
          dotnet restore tests/PCNetworkBackup.Tests/PCNetworkBackup.Tests.csproj

      - name: Build
        run: dotnet build src/PCNetworkBackup.App/PCNetworkBackup.App.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test tests/PCNetworkBackup.Tests/PCNetworkBackup.Tests.csproj --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-Results
          path: '**/*.trx'

      # 1. Self-contained build (Includes .NET runtime ~180MB)
      - name: Publish self-contained win-x64 executable (Full)
        run: >
          dotnet publish src/PCNetworkBackup.App/PCNetworkBackup.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          --output publish_full

      # 2. Framework-dependent build (Requires installed .NET 8 Desktop Runtime ~15MB)
      - name: Publish framework-dependent win-x64 executable (Small)
        run: >
          dotnet publish src/PCNetworkBackup.App/PCNetworkBackup.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          -p:PublishSingleFile=true
          --output publish_small

      - name: Rename executables
        shell: pwsh
        run: |
          Copy-Item "publish_full/PCNetworkBackup.exe" "publish_full/UTZ_FileSync.exe"
          Copy-Item "publish_small/PCNetworkBackup.exe" "publish_small/UTZ_FileSync_Portable_Small.exe"

      - name: Zip Build Outputs
        shell: pwsh
        run: |
          Compress-Archive -Path "publish_full/UTZ_FileSync.exe" -DestinationPath "UTZ_FileSync_Portable_Full.zip"
          Compress-Archive -Path "publish_small/UTZ_FileSync_Portable_Small.exe" -DestinationPath "UTZ_FileSync_Portable_Small.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UTZ_FileSync_Executables
          path: |
            UTZ_FileSync_Portable_Full.zip
            UTZ_FileSync_Portable_Small.zip
            publish_full/UTZ_FileSync.exe
            publish_small/UTZ_FileSync_Portable_Small.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "Latest Release"
          files: |
            UTZ_FileSync_Portable_Full.zip
            UTZ_FileSync_Portable_Small.zip

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}